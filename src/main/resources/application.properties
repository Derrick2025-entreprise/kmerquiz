spring.application.name=kmerquiz
spring.profiles.active=dev

# XAMPP fournit MariaDB : on utilise le pilote MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/kmr_quiz?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# MariaDB 10.4 (XAMPP) est plus ancienne que ce que gère le dialecte standard (10.6+)
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MariaDBLegacyDialect

spring.config.import=optional:file:./secrets.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:86400000}

app.admin.pseudo=${ADMIN_PSEUDO:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3002}

# --- Journalisation ---
logging.level.root=INFO
logging.level.com.exemple.kmerquiz=DEBUG
logging.level.org.springframework.security=INFO
# SQL exécuté par Hibernate (remplace show-sql)
logging.level.org.hibernate.SQL=DEBUG
# Valeurs des paramètres liés (à activer ponctuellement)
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Partie 6 : seuil (ms) au-delà duquel une méthode de service est signalée LENTE
app.logging.slow-threshold-ms=500
